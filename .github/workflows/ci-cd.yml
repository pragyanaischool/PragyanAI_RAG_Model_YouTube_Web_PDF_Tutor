name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r requirements.txt

      - name: Lint Code with Flake8
        run: |
          # Critical syntax and structural errors
          flake8 core/ app.py --count --select=E9,F63,F7,F82 --show-source --statistics
          # Complexity and formatting warnings
          flake8 core/ app.py --count --exit-zero --max-complexity=12 --max-line-length=125 --statistics
